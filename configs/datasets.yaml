# Dataset split CSVs used for the errata re-runs. Copies of the paper-era split
# files with image paths updated (originals untouched); kept out of git (data/).
# Splits verified identical to every other surviving copy (2026-10-14).
#   cup  original: uat_dice/uat_old/data/segmentation/papila_processed/papila_cropped_cup_staple_train_val_test_cal.csv
#   ga   original: uat_dice/uat_old/data/segmentation/geographic_atropy/ga_dataset_train_val_test_cal.csv
# expected_counts = what the paper-era CSV contains (see ERRATA_LOG E9, E10 for
# where the paper text differs).

cup:
  csv: /scratch90/chris_/paper_crisis/data/cup_split.csv
  mask_max_value: 255
  expected_counts: {train: 238, test: 146, cal: 51, val: 51}

ga:
  csv: /scratch90/chris_/paper_crisis/data/ga_split.csv
  mask_max_value: 255
  expected_counts: {train: 40, test: 50, cal: 10, val: 10}   # paper text says 50/40 train/test

octa:
  csv: /scratch90/chris_/paper_crisis/data/octa_faz_split.csv     # new split, seed 2026 (DECISIONS D19)
  mask_max_value: 255
  expected_counts: {train: 150, test: 90, cal: 30, val: 30}
